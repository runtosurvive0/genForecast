# genforecast-backend.service drop-in: 자동 갱신된 현재 릴리스와 그 전용 venv로 실행한다.
# 설치 위치: /etc/systemd/system/genforecast-backend.service.d/backend-current.conf
# 실사용 계획·선박 발견 DB는 기존 공유 데이터 폴더의 파일을 그대로 쓴다.
[Service]
WorkingDirectory=/home/puyo/genforecast/current/backend
Environment=PYTHONPATH=/home/puyo/genforecast/current/backend/src
Environment=MIDTERM_PLANNING_DB=/home/puyo/genforecast-hp-20261012/backend/data/planning-local.sqlite3
Environment=AIS_DISCOVERY_DB=/home/puyo/genforecast-hp-20261012/backend/data/vessel-discovery.sqlite3
ExecStart=
ExecStart=/home/puyo/genforecast/current/.venv/bin/python -m midterm serve --host 127.0.0.1 --port 8093
