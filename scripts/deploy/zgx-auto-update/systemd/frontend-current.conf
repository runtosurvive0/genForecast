# genforecast-frontend.service drop-in: 자동 갱신된 현재 릴리스의 빌드 화면을 그 전용 venv로 제공한다.
# 설치 위치: /etc/systemd/system/genforecast-frontend.service.d/frontend-current.conf
[Service]
WorkingDirectory=/home/puyo/genforecast/current/backend
Environment=PYTHONPATH=/home/puyo/genforecast/current/backend/src
Environment=GENFORECAST_FRONTEND_FILE=/home/puyo/genforecast/current/dist/index.html
ExecStart=
ExecStart=/home/puyo/genforecast/current/.venv/bin/python -m uvicorn midterm.web.frontend:app --host 127.0.0.1 --port 8094 --no-access-log
