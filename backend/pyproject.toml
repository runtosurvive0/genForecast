[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midterm-milp"
version = "0.1.0"
description = "연간 순수요 전망 → 기존 석탄곡선 모델 → 1년 석탄 MILP → 당진본부 일·월 발전량"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "lightgbm>=4.5",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "asyncpg>=0.29",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
